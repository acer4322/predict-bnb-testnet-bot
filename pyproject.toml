[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-prediction-paper-bot"
version = "0.2.0"
description = "Read-only BTC 5-minute Binance Prediction Trading paper bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
    "websocket-client>=1.8,<2",
    "predict_sdk>=0.0.22,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
predict-bot = "predict_bot.cli:main"
predict-backtest = "predict_bot.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
