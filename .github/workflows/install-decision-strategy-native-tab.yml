name: Install decision strategy native tab

on:
  push:
    branches:
      - feature/decision-strategy-native-tab
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/decision-strategy-native-tab

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Apply native React source patch once
        run: python scripts/apply_decision_strategy_native_tab.py

      - name: Verify only main page changed
        run: |
          python scripts/apply_decision_strategy_native_tab.py --check
          git diff --name-only
          test "$(git diff --name-only)" = "dashboard/app/page.tsx"
          ! git diff -- dashboard/app/page.tsx | grep -E '^[-+].*(loadStatistics|/api/state|setStatisticsDown|fetchDashboardJson|STATISTICS_REFRESH_MS|REALTIME_REFRESH_MS)'

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Commit native page source
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dashboard/app/page.tsx; then
            echo "Native decision strategy tab already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/app/page.tsx
          git commit -m "Add decision strategies as native dashboard tab"
          git push origin HEAD:feature/decision-strategy-native-tab
