name: Strategy Lifecycle Guard v2

on:
  push:
    branches:
      - feature/strategy-lifecycle-guard-v2
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Apply guarded native patch
        run: |
          python scripts/apply_strategy_lifecycle_guard_v3.py
          python scripts/fix_strategy_lifecycle_test_gate.py
          python scripts/fix_strategy_lifecycle_legacy_assertions.py

      - name: Verify patch scope
        run: |
          python scripts/apply_strategy_lifecycle_guard_v3.py --check
          git diff --stat
          git diff --numstat
          test_deletions=$(git diff --numstat -- tests/test_live_trading.py | awk '{print $2+0}')
          if [ "$test_deletions" -gt 180 ]; then
            echo "tests/test_live_trading.py deletion scope is too large: $test_deletions"
            exit 1
          fi
          ! git diff -- src/predict_bot/live_trading.py | grep -E '^[-+].*(_quote_is_safe|_latest_prediction_book_check|_drawdown_control_is_safe|_strategy_observer_gate_is_safe|consume_loss_cooldown)' || {
            echo "Lifecycle patch touched unrelated live safety logic."
            exit 1
          }
          ! git diff -- dashboard/app/page.tsx | grep -E '^[-+].*(loadStatistics|/api/state|setStatisticsDown|fetchDashboardJson|STATISTICS_REFRESH_MS|REALTIME_REFRESH_MS)' || {
            echo "Lifecycle patch touched dashboard data loading."
            exit 1
          }

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lifecycle unit tests
        run: python -m pytest tests/test_strategy_lifecycle_guard.py -q

      - name: Full live executor regression tests
        run: python -m pytest tests/test_live_trading.py -q

      - name: Compile modified Python
        run: python -m py_compile src/predict_bot/strategy_lifecycle_guard.py src/predict_bot/live_trading.py tests/test_strategy_lifecycle_guard.py tests/test_live_trading.py

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint Lifecycle component
        working-directory: dashboard
        run: npx eslint app/strategy-lifecycle-guard.tsx

      - name: Dashboard production build
        working-directory: dashboard
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit validated native sources
        if: github.event_name == 'push'
        run: |
          rm .github/workflows/strategy-lifecycle-guard-v2.yml
          rm scripts/apply_strategy_lifecycle_guard_v3.py
          rm scripts/fix_strategy_lifecycle_test_gate.py
          rm scripts/fix_strategy_lifecycle_legacy_assertions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace M0 hourly guard with Strategy Lifecycle Guard"
          git push
