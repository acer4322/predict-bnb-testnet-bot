name: Decision strategy test

on:
  push:
    branches:
      - feature/decision-strategy-test
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Integrate native main-page tab
        run: python scripts/integrate_decision_strategy_tab.py

      - name: Verify native tab structure
        run: >-
          python -c "from pathlib import Path;
          text=Path('dashboard/app/page.tsx').read_text(encoding='utf-8');
          assert 'id=\"decision-strategy-tab\"' in text;
          assert 'id=\"decision-strategy-panel\"' not in text;
          assert 'DecisionStrategyTestPanel payload={state}' in text;
          assert 'decision-strategy-test/page.tsx' not in '\n'.join(str(p) for p in Path('dashboard/app').rglob('*.tsx'))"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Import package
        run: python -c "import predict_bot; from predict_bot import live_trading, m_realtime; assert 'R_DECISION_RANK1' in live_trading.LIVE_SUPPORTED_STRATEGIES; assert 'R_DECISION_RANK2' in live_trading.LIVE_SUPPORTED_STRATEGIES; assert 'R_DECISION_RANK1' in m_realtime.LIVE_FORWARDABLE_PAPER_STRATEGIES; assert 'R_DECISION_RANK2' in m_realtime.LIVE_FORWARDABLE_PAPER_STRATEGIES"

      - name: Decision strategy tests
        run: >-
          python -m pytest
          tests/test_decision_strategy_shadows.py
          tests/test_decision_strategy_runtime.py
          tests/test_decision_strategy_isolation.py
          tests/test_live_trading.py
          -q

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Dashboard type check
        working-directory: dashboard
        run: npm run lint

      - name: Dashboard tests
        working-directory: dashboard
        run: npm test -- --runInBand

      - name: Dashboard production build
        working-directory: dashboard
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit native tab integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dashboard/app/page.tsx; then
            echo "Native decision tab already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/app/page.tsx
          git commit -m "Integrate decision strategies as native main-page tab"
          git push
