name: Apply strong trend protection metrics fix

on:
  push:
    branches:
      - main
    paths:
      - .github/.strong-trend-protection-metrics-trigger
  pull_request:
    branches:
      - main
    paths:
      - .github/.strong-trend-protection-metrics-pr-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/regime-guard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/fix-strong-trend-protection-metrics.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if old not in text:\n        raise RuntimeError(f"anchor not found in {path}: {old[:180]!r}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")',
              '    if old not in text:\n        if new in text:\n            return\n        raise RuntimeError(f"anchor not found in {path}: {old[:180]!r}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")',
          )
          text = text.replace(
              'if "test_blocked_protection_uses_all_realized_source_exit_statuses" in text:\n    raise RuntimeError("tests already patched")\ntests.write_text(text + append, encoding="utf-8")',
              'if "test_blocked_protection_uses_all_realized_source_exit_statuses" not in text:\n    tests.write_text(text + append, encoding="utf-8")',
          )
          text = text.replace(
              'payload = store.dashboard()["researchForward"]["strongTrendGuardExperiment"]',
              'payload = _experiment_state(store)',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply metrics fix
        run: python .github/scripts/fix-strong-trend-protection-metrics.py
      - name: Import regression-test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_strong_trend_guard_shadows.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    evaluate_strong_trend,\n)'
          replacement = '    evaluate_strong_trend,\n    _experiment_state,\n)'
          if '_experiment_state,' not in text:
              if anchor not in text:
                  raise RuntimeError('strong trend import anchor missing')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run strong trend tests
        run: python -m pytest -q tests/test_strong_trend_guard_shadows.py tests/test_research_strategy_registry.py
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Verify native dashboard architecture
        working-directory: dashboard
        run: |
          node --test tests/native-strong-trend-guard.test.mjs
          node --test tests/native-microprice-strategy-panel.test.mjs
      - name: Commit target branch
        run: |
          rm -f .github/scripts/fix-strong-trend-protection-metrics.py
          rm -f .github/.strong-trend-protection-metrics-pr-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(research): count realized blocked guard outcomes"
          git push origin HEAD:feature/regime-guard
      - name: Remove one-shot runner from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-strong-trend-protection-metrics-fix.yml
          rm -f .github/.strong-trend-protection-metrics-trigger
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove one-shot strong trend metrics runner"
          git push origin HEAD:main
