name: Apply strong trend protection metrics fix

on:
  push:
    branches:
      - main
    paths:
      - .github/.strong-trend-protection-metrics-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/regime-guard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply metrics fix
        run: python .github/scripts/fix-strong-trend-protection-metrics.py
      - name: Run strong trend tests
        run: python -m pytest -q tests/test_strong_trend_guard_shadows.py tests/test_research_strategy_registry.py
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Verify native dashboard architecture
        working-directory: dashboard
        run: |
          node --test tests/native-strong-trend-guard.test.mjs
          node --test tests/native-microprice-strategy-panel.test.mjs
      - name: Commit target branch
        run: |
          rm -f .github/scripts/fix-strong-trend-protection-metrics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(research): count realized blocked guard outcomes"
          git push origin HEAD:feature/regime-guard
      - name: Remove one-shot runner from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-strong-trend-protection-metrics-fix.yml
          rm -f .github/.strong-trend-protection-metrics-trigger
          git add -A
          git commit -m "chore: remove one-shot strong trend metrics runner"
          git push origin HEAD:main
