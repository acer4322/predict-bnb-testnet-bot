# Existing workflow trigger: implementation is committed only after all checks pass.
name: Apply stable direction shadow

on:
  push:
    branches:
      - feature/regime-guard
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-guard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply native research Shadow patch
        run: python .github/scripts/apply_stable_direction_shadow.py
      - name: Validate Python syntax
        run: |
          python -m py_compile \
            src/predict_bot/microprice_confirm_stable_direction_shadow.py \
            src/predict_bot/__init__.py \
            src/predict_bot/server.py \
            tests/test_microprice_confirm_stable_direction_shadow.py
      - name: Install Python project
        run: python -m pip install -e . pytest
      - name: Run focused Python regression tests
        run: |
          pytest -q \
            tests/test_microprice_confirm_stable_direction_shadow.py \
            tests/test_microprice_confirm_stable_consensus_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Test and build dashboard
        run: npm test --prefix dashboard
      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply_stable_direction_shadow.py
          rm -f .github/workflows/apply-stable-direction-shadow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add stable direction paper shadow"
          git push origin HEAD:feature/regime-guard
