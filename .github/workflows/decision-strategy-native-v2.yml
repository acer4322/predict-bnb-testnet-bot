name: Decision strategy native v2

on:
  push:
    branches:
      - feature/decision-strategy-native-v2
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Apply guarded one-time native React source patch
        run: python scripts/apply_decision_strategy_native_tab.py

      - name: Verify native page source and untouched data loader
        run: |
          python scripts/apply_decision_strategy_native_tab.py --check
          git diff -- dashboard/app/page.tsx
          ! git diff -- dashboard/app/page.tsx | grep -E '^[-+].*(loadStatistics|/api/state|setStatisticsDown|fetchDashboardJson|STATISTICS_REFRESH_MS|REALTIME_REFRESH_MS)' || {
            echo "The native tab patch touched the existing data-loading path."
            exit 1
          }

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Import package
        run: >-
          python -c "import predict_bot; from predict_bot.decision_strategy_rules import STRATEGIES; from predict_bot.research_forward import RESEARCH_STRATEGIES, GENERIC_SIGNAL_RESEARCH_STRATEGIES; from predict_bot import live_trading, m_realtime; assert set(STRATEGIES) <= set(RESEARCH_STRATEGIES); assert not (set(STRATEGIES) & set(GENERIC_SIGNAL_RESEARCH_STRATEGIES)); assert set(STRATEGIES) <= set(live_trading.LIVE_SUPPORTED_STRATEGIES); assert set(STRATEGIES) <= set(m_realtime.LIVE_FORWARDABLE_PAPER_STRATEGIES)"

      - name: Backend decision and regression tests
        run: >-
          python -m pytest
          tests/test_decision_strategy_native_v2.py
          tests/test_decision_strategy_config_v2.py
          tests/test_strong_trend_guard_shadows.py
          tests/test_calibrated_value_confirmation_variants.py
          tests/test_live_trading.py
          -q

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Dashboard lint
        working-directory: dashboard
        run: npm run lint

      - name: Dashboard tests
        working-directory: dashboard
        run: npm test

      - name: Dashboard production build
        working-directory: dashboard
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit native page source
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dashboard/app/page.tsx; then
            echo "Native decision strategy tab already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/app/page.tsx
          git commit -m "Add decision strategies as native main dashboard tab"
          git push
