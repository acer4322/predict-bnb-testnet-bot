name: Microprice C3 midpoint focused

on:
  pull_request:
    branches:
      - feature/regime-guard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused Microprice C3 tests
        run: python -m pytest tests/test_microprice_c3_mid_confirm.py -q

      - name: Diff check
        run: git diff --check
