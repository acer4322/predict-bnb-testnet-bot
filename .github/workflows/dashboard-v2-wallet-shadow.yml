name: Dashboard V2 Wallet Shadow

on:
  push:
    branches:
      - feature/dashboard-v2-wallet-shadow-6da6
  pull_request:
    branches:
      - feature/dashboard-v2-polyhermes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Wallet shadow backend tests
        run: python -m pytest tests/test_predict_wallet_shadow_observer.py tests/test_multi_asset_live_supervisor.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install Dashboard V2 dependencies
        working-directory: dashboard-v2
        run: npm install --no-audit --no-fund

      - name: Typecheck Wallet Shadow files
        working-directory: dashboard-v2
        run: npx tsc -p tsconfig.wallet-shadow.json

      - name: Bundle Dashboard V2
        working-directory: dashboard-v2
        run: npx vite build

      - name: Diff check
        run: git diff --check
