name: Dashboard V2 Wallet Shadow

on:
  push:
    branches:
      - feature/dashboard-v2-polyhermes
      - feature/dashboard-v2-wallet-shadow-performance
      - feature/dashboard-v2-wallet-shadow-recent10-analysis
      - feature/dashboard-v2-wallet-shadow-taker-v1
      - feature/dashboard-v2-spot-strike-forward-panel
  pull_request:
    branches:
      - feature/dashboard-v2-polyhermes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package and research dependencies
        run: python -m pip install -e ".[dev,research]"

      - name: Wallet shadow backend tests
        run: python -m pytest tests/test_predict_wallet_shadow_observer.py tests/test_predict_wallet_shadow_performance.py tests/test_predict_wallet_shadow_taker_v1.py tests/test_predict_wallet_shadow_spot_strike_forward.py tests/test_predict_wallet_shadow_spot_strike_dashboard.py tests/test_predict_wallet_shadow_v4_14.py tests/test_predict_wallet_shadow_persistent_cache.py tests/test_predict_wallet_reconstructed_maker_v2.py tests/test_predict_wallet_reconstructed_maker_v3.py tests/test_predict_wallet_shadow_v4_17.py tests/test_predict_wallet_lifecycle_state_taker_v4.py tests/test_predict_wallet_maker_book_inference_collector.py tests/test_predict_wallet_maker_book_lifecycle_inference.py tests/test_predict_wallet_maker_book_lifecycle_v21.py tests/test_predict_wallet_shadow_retired_labs.py tests/test_target_maker_ebm_dataset.py tests/test_target_maker_ebm_v2.py tests/test_target_maker_ebm_v3_dataset.py tests/test_target_maker_ebm_v3.py tests/test_target_maker_taker_link.py tests/test_target_maker_taker_link_v2.py tests/test_target_maker_taker_state_link_v3.py tests/test_target_maker_taker_state_link_v3_model.py tests/test_target_taker_behavior_v1.py tests/test_target_eth_taker_behavior_v1.py tests/test_target_eth_taker_behavior_v1_model.py tests/test_dashboard_v2_research_export.py tests/test_wallet_shadow_recent_analysis.py tests/test_multi_asset_live_supervisor.py -q

      - name: Compile Maker and Taker research tools
        run: python -m py_compile src/predict_bot/target_maker_ebm_dataset.py src/predict_bot/target_maker_ebm_v3_dataset.py src/predict_bot/target_maker_taker_link.py src/predict_bot/target_maker_taker_link_v2.py src/predict_bot/target_maker_taker_state_link_v3.py src/predict_bot/target_taker_behavior_v1.py src/predict_bot/target_eth_taker_behavior_v1.py src/predict_bot/target_eth_taker_hazard_v1.py src/predict_bot/predict_wallet_eth_taker_signal_collector.py src/predict_bot/predict_wallet_reconstructed_maker_strategy_v3.py src/predict_bot/predict_wallet_lifecycle_state_taker_strategy_v4.py src/predict_bot/predict_wallet_shadow_observer_v4_17.py src/predict_bot/predict_wallet_shadow_observer_v4_18.py tools/build_target_maker_ebm_dataset.py tools/build_target_maker_ebm_v3_dataset.py tools/build_target_maker_taker_state_link_v3_dataset.py tools/build_target_taker_behavior_v1_dataset.py tools/build_target_eth_taker_behavior_v1_dataset.py tools/build_target_eth_taker_hazard_v1_dataset.py tools/train_target_maker_ebm.py tools/train_target_maker_ebm_v2.py tools/train_target_maker_ebm_v3.py tools/train_target_maker_taker_state_link_v3.py tools/train_target_taker_behavior_v1.py tools/train_target_eth_taker_behavior_v1.py tools/analyze_target_maker_taker_link.py tools/analyze_target_maker_taker_link_v2.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install Dashboard V2 dependencies
        working-directory: dashboard-v2
        run: npm install --no-audit --no-fund

      - name: Typecheck Wallet Shadow files
        working-directory: dashboard-v2
        run: npx tsc -p tsconfig.wallet-shadow.json

      - name: Bundle Dashboard V2
        working-directory: dashboard-v2
        run: npx vite build

      - name: Diff check
        run: git diff --check
