name: Apply Stable Direction A/B

on:
  push:
    branches:
      - feature/regime-guard

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'trigger Stable Direction A/B')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/regime-guard
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Apply guarded patch
        run: python .github/scripts/apply_stable_direction_ab.py

      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run Stable Direction and registry tests
        run: >-
          python -m pytest
          tests/test_microprice_confirm_stable_direction_shadow.py
          tests/test_research_strategy_registry.py
          -q

      - name: Build Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Verify native Dashboard controls
        working-directory: dashboard
        run: node --test tests/native-observer-controls.test.mjs

      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-stable-direction-ab.yml
          rm -f .github/scripts/apply_stable_direction_ab.py
          rm -f .github/.stable-direction-ab-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(research): add Stable Direction BASE and STRICT'
          git push origin HEAD:feature/regime-guard
