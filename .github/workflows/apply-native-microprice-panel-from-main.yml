name: Apply native Microprice panel from main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/.native-microprice-panel-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/regime-guard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply patch
        run: python .github/scripts/apply-native-microprice-panel.py
      - name: Run targeted backend tests
        run: python -m pytest -q tests/test_research_strategy_registry.py tests/test_strong_trend_guard_shadows.py
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Verify native Microprice architecture
        working-directory: dashboard
        run: |
          node --test tests/native-strong-trend-guard.test.mjs
          node --test tests/native-microprice-strategy-panel.test.mjs
      - name: Commit target branch
        run: |
          rm -f .github/scripts/apply-native-microprice-panel.py
          rm -f .github/.native-microprice-panel-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(dashboard): add native Microprice strategy section"
          git push origin HEAD:feature/regime-guard
      - name: Remove one-shot runner from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-native-microprice-panel-from-main.yml
          git add -A
          git commit -m "chore: remove one-shot Microprice panel runner"
          git push origin HEAD:main
