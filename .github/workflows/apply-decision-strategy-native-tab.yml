name: Apply decision strategy native tab

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/.decision-strategy-native-tab-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/decision-strategy-test
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Apply native main-page tab patch
        run: python scripts/integrate_decision_strategy_tab.py

      - name: Verify native tab structure
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('dashboard/app/page.tsx').read_text(encoding='utf-8')
          assert 'import DecisionStrategyTestPanel from "./decision-strategy-test-panel";' in page
          assert 'id="decision-strategy-tab"' in page
          assert 'aria-controls="decision-strategy-panel"' in page
          assert 'DecisionStrategyTestPanel payload={state} onReset={resetStrategy} resetStates={resetStates}' in page
          assert '"decision-strategy"' in page
          assert not Path('dashboard/app/decision-strategy-test/page.tsx').exists()
          layout = Path('dashboard/app/layout.tsx').read_text(encoding='utf-8')
          assert '/decision-strategy-test' not in layout
          panel = Path('dashboard/app/decision-strategy-test-panel.tsx').read_text(encoding='utf-8')
          assert 'role="tabpanel"' in panel
          assert 'id="decision-strategy-panel"' in panel
          assert 'setInterval' not in panel
          assert 'fetch(' not in panel
          PY

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused backend tests
        run: >-
          python -m pytest -q
          tests/test_decision_strategy_shadows.py
          tests/test_decision_strategy_runtime.py
          tests/test_live_trading.py
          tests/test_m_realtime.py

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Test dashboard
        working-directory: dashboard
        run: npm test -- --runInBand

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit target branch
        run: |
          rm -f scripts/integrate_decision_strategy_tab.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(dashboard): add native decision strategy tab"
          git push origin HEAD:feature/decision-strategy-test

      - name: Remove one-shot runner from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-decision-strategy-native-tab.yml
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove one-shot decision strategy runner"
          git push origin HEAD:main
